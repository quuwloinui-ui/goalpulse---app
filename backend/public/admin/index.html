<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoalPulse · Control room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="login" class="login" hidden>
    <form id="loginForm" class="form" autocomplete="on">
      <h1>GoalPulse</h1>
      <p class="muted">Sign in to the control room.</p>
      <label>Email <input name="email" type="email" required autocomplete="username"></label>
      <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
      <p class="error" id="loginError" role="alert" hidden></p>
      <button class="btn primary">Sign in</button>
    </form>
  </main>

  <div id="app" class="shell" hidden>
    <aside class="side">
      <div class="brand">GoalPulse<small>Control room</small></div>
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <button class="logout btn small" id="logout" type="button">Sign out</button>
    </aside>
    <main class="main" id="view" tabindex="-1"></main>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
