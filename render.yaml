# Render Blueprint: New + > Blueprint > pick this repo. Plan names change over time; adjust to your account.
databases:
  - name: goalpulse-db
    databaseName: goalpulse
    user: goalpulse
    plan: basic-256mb

services:
  - type: keyvalue            # Redis-compatible store
    name: goalpulse-redis
    plan: starter
    maxmemoryPolicy: volatile-lru
    ipAllowList: []           # internal connections only

  - type: web
    name: goalpulse-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter             # WebSockets + the live worker need an always-on instance (not "free")
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: goalpulse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: goalpulse-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FOOTBALL_PROVIDER
        value: sportscore     # free, no API key needed
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: CORS_ORIGINS
        value: "*"
