# Local infrastructure:  docker compose up -d postgres redis
# Whole stack in containers:  docker compose --profile full up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: goalpulse
      POSTGRES_PASSWORD: goalpulse
      POSTGRES_DB: goalpulse
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goalpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["full"]
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://goalpulse:goalpulse@postgres:5432/goalpulse?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata: {}
  redisdata: {}
