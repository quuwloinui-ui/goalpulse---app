name: Build Flutter APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          
      - name: Generate Android Folder & Fix Configurations
        run: |
          cd mobile
          
          # 1. إنشاء مجلد أندرويد نظيف
          rm -rf android
          flutter create . --platforms=android
          flutter pub get
          
          # 2. تحديث نسخة Gradle إلى 8.7
          sed -i 's/distributionUrl=.*/distributionUrl=https\\:\/\/services.gradle.org\/distributions\/gradle-8.7-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
          
          # 3. تحديث نسخ Android SDK و Kotlin (باستخدام بايثون لضمان الدقة)
          python3 -c "
          import re
          with open('android/settings.gradle', 'r') as f:
              s = f.read()
          s = re.sub(r'id\s+[\"']com\.android\.application[\"']\s+version\s+[\"'][^\"']+[\"']', 'id \"com.android.application\" version \"8.3.0\"', s)
          s = re.sub(r'id\s+[\"']com\.android\.library[\"']\s+version\s+[\"'][^\"']+[\"']', 'id \"com.android.library\" version \"8.3.0\"', s)
          s = re.sub(r'id\s+[\"']org\.jetbrains\.kotlin\.android[\"']\s+version\s+[\"'][^\"']+[\"']', 'id \"org.jetbrains.kotlin.android\" version \"2.1.0\"', s)
          with open('android/settings.gradle', 'w') as f:
              f.write(s)
          "
          
          # 4. إجبار التطبيق على Android SDK 34
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle
          
          # 5. إصلاح خطأ compileSdkVersion في المكتبات
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/flutter.compileSdkVersion/34/g' {} +
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/flutter.targetSdkVersion/34/g' {} +

          # 6. السماح باتصالات HTTP
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoalPulse-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
