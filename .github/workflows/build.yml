name: Build Flutter APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          
      - name: Generate Android Folder & Fix Configurations
        run: |
          cd mobile
          
          # 1. تنظيف المشروع وإنشاء مجلد أندرويد نظيف
          flutter clean
          rm -rf android
          flutter create . --platforms=android
          
          # 2. إجبار المشروع على استخدام النسخة المستقرة من المكتبة المسببة للمشكلة
          python3 -c "
          with open('pubspec.yaml', 'r') as f:
              lines = f.readlines()
          override_idx = -1
          for i, line in enumerate(lines):
              if line.strip() == 'dependency_overrides:':
                  override_idx = i
                  break
          if override_idx != -1:
              lines.insert(override_idx + 1, '  package_info_plus: 8.3.0\n')
          else:
              lines.append('\ndependency_overrides:\n  package_info_plus: 8.3.0\n')
          with open('pubspec.yaml', 'w') as f:
              f.writelines(lines)
          "
          
          flutter pub get
          
          # 3. تحديث نسخة Gradle
          sed -i 's/distributionUrl=.*/distributionUrl=https\\:\/\/services.gradle.org\/distributions\/gradle-8.7-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
          
          # 4. سكربت بايثون الآمن (لإصلاح كل شيء)
          cat << 'EOF' > fix_build.py
          import os, glob, re

          # تعديل settings.gradle
          with open('android/settings.gradle', 'r') as f:
              s = f.read()
          s = re.sub(r'id\s+[\"\']com\.android\.application[\"\']\s+version\s+[\"\'][^\"\']+[\"\']', 'id \"com.android.application\" version \"8.3.0\"', s)
          s = re.sub(r'id\s+[\"\']com\.android\.library[\"\']\s+version\s+[\"\'][^\"\']+[\"\']', 'id \"com.android.library\" version \"8.3.0\"', s)
          s = re.sub(r'id\s+[\"\']org\.jetbrains\.kotlin\.android[\"\']\s+version\s+[\"\'][^\"\']+[\"\']', 'id \"org.jetbrains.kotlin.android\" version \"1.9.24\"', s)
          with open('android/settings.gradle', 'w') as f:
              f.write(s)

          # تعديل build.gradle
          with open('android/build.gradle', 'r') as f:
              b = f.read()
          b = re.sub(r'ext\.kotlin_version\s*=\s*[\"\'][^\"\']+[\"\']', 'ext.kotlin_version = \"1.9.24\"', b)
          with open('android/build.gradle', 'w') as f:
              f.write(b)

          # تعديل app/build.gradle
          with open('android/app/build.gradle', 'r') as f:
              app = f.read()

          app = app.replace('flutter.compileSdkVersion', '34')
          app = app.replace('flutter.targetSdkVersion', '34')
          app = app.replace('flutter.ndkVersion', '\"25.1.8937393\"')

          if 'coreLibraryDesugaringEnabled' not in app:
              app = app.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true')
          if 'desugar_jdk_libs' not in app:
              app += '\n\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"\n}\n'

          if 'minifyEnabled false' not in app:
              app = app.replace('signingConfig = signingConfigs.debug', 'signingConfig = signingConfigs.debug\n            minifyEnabled false\n            shrinkResources false')
              app = app.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.debug\n            minifyEnabled false\n            shrinkResources false')

          with open('android/app/build.gradle', 'w') as f:
              f.write(app)

          # إصلاح المكتبات في الذاكرة
          pub_cache = os.path.expanduser('~/.pub-cache')
          for filepath in glob.glob(f'{pub_cache}/**/build.gradle', recursive=True):
              try:
                  with open(filepath, 'r') as f:
                      content = f.read()
                  content = content.replace('flutter.compileSdkVersion', '34')
                  content = content.replace('flutter.targetSdkVersion', '34')
                  with open(filepath, 'w') as f:
                      f.write(content)
              except Exception:
                  pass
          EOF

          python3 fix_build.py
          
          # 5. السماح باتصالات HTTP
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoalPulse-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
