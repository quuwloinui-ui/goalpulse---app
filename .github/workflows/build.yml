name: Build Flutter APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          
      - name: Generate Android Folder & Fix Configurations
        run: |
          cd mobile
          flutter create . --platforms=android
          
          # استخدام سكربت بايثون لتعديل ملفات Gradle بشكل مضمون
          python3 -c "
import re
# 1. إصلاح settings.gradle (تحديث Kotlin)
with open('android/settings.gradle', 'r') as f:
    s = f.read()
s = re.sub(r'org\.jetbrains\.kotlin\.android\"\s+version\s+\"[^\"]+\"', 'org.jetbrains.kotlin.android\" version \"1.9.22\"', s)
s = re.sub(r'org\.jetbrains\.kotlin\.android\'\s+version\s+\'[^\']+\'', 'org.jetbrains.kotlin.android\' version \'1.9.22\'', s)
with open('android/settings.gradle', 'w') as f:
    f.write(s)

# 2. إصلاح build.gradle (تحديث Kotlin و Gradle)
with open('android/build.gradle', 'r') as f:
    b = f.read()
b = re.sub(r'ext\.kotlin_version\s*=\s*[\"\'][^\"\']+[\"\']', 'ext.kotlin_version = \"1.9.22\"', b)
b = re.sub(r'com\.android\.tools\.build:gradle:[^\']+', 'com.android.tools.build:gradle:8.1.0', b)
with open('android/build.gradle', 'w') as f:
    f.write(b)

# 3. إصلاح app/build.gradle (تحديث SDK 34)
with open('android/app/build.gradle', 'r') as f:
    app = f.read()
app = re.sub(r'compileSdkVersion\s+[a-zA-Z0-9\.]+', 'compileSdkVersion 34', app)
app = re.sub(r'compileSdk\s*=\s*[a-zA-Z0-9\.]+', 'compileSdk = 34', app)
app = re.sub(r'targetSdkVersion\s+[a-zA-Z0-9\.]+', 'targetSdkVersion 34', app)
app = re.sub(r'targetSdk\s*=\s*[a-zA-Z0-9\.]+', 'targetSdk = 34', app)
with open('android/app/build.gradle', 'w') as f:
    f.write(app)

# 4. إصلاح AndroidManifest.xml (السماح بـ HTTP)
with open('android/app/src/main/AndroidManifest.xml', 'r') as f:
    manifest = f.read()
if 'android:usesCleartextTraffic' not in manifest:
    manifest = manifest.replace('<application', '<application android:usesCleartextTraffic=\"true\"', 1)
with open('android/app/src/main/AndroidManifest.xml', 'w') as f:
    f.write(manifest)
"

      - name: Build APK
        run: |
          cd mobile
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoalPulse-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
