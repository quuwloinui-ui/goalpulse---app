name: Build Flutter APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          
      - name: Generate Android Folder & Fix Configurations
        run: |
          cd mobile
          
          # 1. مسح أي إعدادات سابقة (تنظيف)
          sed -i '/dependency_overrides:/,$d' pubspec.yaml || true
          
          # 2. إنشاء المجلد وتحميل المكتبات الأساسية (بأحدث إصداراتها)
          flutter create . --platforms=android
          flutter pub get
          
          # 3. إصلاح نسخة Kotlin للمشروع الأساسي
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.22"/g' android/settings.gradle
          sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.22'/g" android/build.gradle
          
          # 4. إجبار التطبيق الأساسي على استخدام Android SDK 34
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle
          
          # 5. الضربة القاضية: البحث داخل مجلدات المكتبات (Cache) واستبدال أي إشارة لكلمة flutter بـ 34
          find ~/.pub-cache/hosted/pub.dev -name "build.gradle" -exec sed -i 's/flutter.compileSdkVersion/34/g' {} +
          find ~/.pub-cache/hosted/pub.dev -name "build.gradle" -exec sed -i 's/flutter.targetSdkVersion/34/g' {} +
          
          # 6. السماح باتصالات HTTP للسيرفر المحلي
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoalPulse-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
