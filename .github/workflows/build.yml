name: Build Flutter APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          
      - name: Generate Android Folder & Fix Configurations
        run: |
          cd mobile
          
          # 1. إنشاء مجلد الأندرويد
          flutter create . --platforms=android
          
          # 2. إزالة أي تعديلات سابقة لملف pubspec
          sed -i '/dependency_overrides:/,$d' pubspec.yaml || true
          
          # 3. تحميل المكتبات
          flutter pub get
          
          # 4. إصلاح نسخة Kotlin
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.22"/g' android/settings.gradle
          sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.22'/g" android/build.gradle
          
          # 5. إجبار التطبيق الأساسي على SDK 34
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle
          
          # 6. الحل الجذري: استبدال المتغير الفارغ بالنص "34" في جميع المكتبات لمنع خطأ substring
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/flutter.compileSdkVersion/"34"/g' {} +
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/flutter.targetSdkVersion/"34"/g' {} +
          
          # 7. السماح باتصالات HTTP
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoalPulse-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
