name: Build Flutter APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          
      - name: Generate Android Folder & Fix Configurations
        run: |
          cd mobile
          
          # 1. تنظيف المشروع لضمان عدم وجود ملفات قديمة متعارضة
          flutter clean
          
          # 2. إنشاء مجلد الأندرويد وتحميل المكتبات
          flutter create . --platforms=android
          flutter pub get
          
          # 3. تحديث نسخة Kotlin باستخدام perl (يتعامل مع علامات التنصيص المفردة والمزدوجة)
          perl -pi -e "s/id ['\"]org.jetbrains.kotlin.android['\"] version ['\"][^'\"]*['\"]/id \"org.jetbrains.kotlin.android\" version \"1.9.22\"/g" android/settings.gradle
          perl -pi -e "s/ext.kotlin_version\s*=\s*['\"][^'\"]*['\"]/ext.kotlin_version = '1.9.22'/g" android/build.gradle
          
          # 4. إجبار التطبيق الأساسي على Android SDK 34
          perl -pi -e 's/compileSdk\s*=\s*flutter\.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle
          perl -pi -e 's/targetSdk\s*=\s*flutter\.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle
          
          # 5. الضربة القاضية: تعديل كل مكتبات Flutter في الذاكرة لمنع خطأ substring
          find ~/.pub-cache -name "build.gradle" -exec perl -pi -e 's/compileSdkVersion\s+flutter\.compileSdkVersion/compileSdkVersion 34/g' {} +
          find ~/.pub-cache -name "build.gradle" -exec perl -pi -e 's/compileSdkVersion\s+[0-9]+/compileSdkVersion 34/g' {} +

          # 6. السماح باتصالات HTTP
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoalPulse-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
