name: Build Flutter APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          
      - name: Prepare Project & Fix Dependencies
        run: |
          cd mobile
          
          # 1. مسح مجلد الأندرويد القديم بالكامل (لضمان النظافة)
          rm -rf android
          
          # 2. إجبار المكتبة على استخدام نسخة مستقرة (بدون تعديلات ملفات معقدة)
          echo -e "\ndependency_overrides:\n  package_info_plus: 8.1.0" >> pubspec.yaml
          
          # 3. إنشاء مجلد أندرويد جديد ونظيف
          flutter create . --platforms=android
          flutter pub get
          
          # 4. تعديل نسخة Kotlin باستخدام perl (يتعامل مع أي علامات تنصيص)
          perl -pi -e "s/id ['\"]org.jetbrains.kotlin.android['\"] version ['\"][^'\"]*['\"]/id \"org.jetbrains.kotlin.android\" version \"1.9.22\"/g" android/settings.gradle
          
          # 5. إجبار التطبيق الأساسي على Android SDK 34 (بالصيغة الجديدة)
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle
          
          # 6. السماح باتصالات HTTP للسيرفر المحلي
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoalPulse-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
