name: Build Flutter APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          
      - name: Generate Android Folder & Fix Configurations
        run: |
          cd mobile
          
          # 1. مسح المجلد وإنشاء واحد نظيف
          rm -rf android
          flutter create . --platforms=android
          flutter pub get
          
          # 2. تحديث نسخة Gradle إلى 8.7
          sed -i 's/distributionUrl=.*/distributionUrl=https\\:\/\/services.gradle.org\/distributions\/gradle-8.7-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
          
          # 3. إعداد سكربت بايثون لتعديل كل الإعدادات المعقدة دفعة واحدة
          cat << 'EOF' > fix_gradle.py
          import re, os, glob

          # 1. تعديل settings.gradle (تحديث Kotlin و AGP)
          with open('android/settings.gradle', 'r') as f:
              s = f.read()
          s = re.sub(r'id\s+["\']com\.android\.application["\']\s+version\s+["\'][^"\']+["\']', 'id "com.android.application" version "8.3.0"', s)
          s = re.sub(r'id\s+["\']com\.android\.library["\']\s+version\s+["\'][^"\']+["\']', 'id "com.android.library" version "8.3.0"', s)
          s = re.sub(r'id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'][^"\']+["\']', 'id "org.jetbrains.kotlin.android" version "1.9.24"', s)
          with open('android/settings.gradle', 'w') as f:
              f.write(s)

          # 2. تعديل build.gradle
          with open('android/build.gradle', 'r') as f:
              b = f.read()
          b = re.sub(r'ext\.kotlin_version\s*=\s*[\'"][^\'"]*[\'"]', 'ext.kotlin_version = "1.9.24"', b)
          with open('android/build.gradle', 'w') as f:
              f.write(b)

          # 3. تعديل app/build.gradle (NDK، SDK، Desugaring، وتخطي ضغط R8)
          with open('android/app/build.gradle', 'r') as f:
              app = f.read()

          # إضافة NDK
          app = re.sub(r'android\s*{', 'android {\n    ndkVersion = "25.1.8937393"', app)

          # إعداد SDK 34
          app = re.sub(r'compileSdkVersion\s+[a-zA-Z0-9\.]+', 'compileSdkVersion 34', app)
          app = re.sub(r'compileSdk\s*=\s*[a-zA-Z0-9\.]+', 'compileSdk = 34', app)
          app = re.sub(r'targetSdkVersion\s+[a-zA-Z0-9\.]+', 'targetSdkVersion 34', app)
          app = re.sub(r'targetSdk\s*=\s*[a-zA-Z0-9\.]+', 'targetSdk = 34', app)

          # إضافة Desugaring للإشعارات
          app = re.sub(r'compileOptions\s*{', 'compileOptions {\n        coreLibraryDesugaringEnabled true', app)
          app = re.sub(r'dependencies\s*{', 'dependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"', app)

          # تعطيل R8 (مهم جداً لتجنب انهيار البناء في المرحلة الأخيرة)
          app = re.sub(r'release\s*{', 'release {\n            minifyEnabled false\n            shrinkResources false', app)

          with open('android/app/build.gradle', 'w') as f:
              f.write(app)

          # 4. إصلاح كل مكتبات Flutter لحل مشكلة substring
          pub_cache = os.path.expanduser('~/.pub-cache')
          for filepath in glob.glob(f'{pub_cache}/**/build.gradle', recursive=True):
              try:
                  with open(filepath, 'r') as f:
                      content = f.read()
                  content = re.sub(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 34', content)
                  content = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 34', content)
                  content = re.sub(r'targetSdkVersion\s+flutter\.targetSdkVersion', 'targetSdkVersion 34', content)
                  content = re.sub(r'targetSdk\s*=\s*flutter\.targetSdkVersion', 'targetSdk = 34', content)
                  with open(filepath, 'w') as f:
                      f.write(content)
              except Exception:
                  pass
          EOF

          # 4. تشغيل السكربت
          python3 fix_gradle.py
          
          # 5. السماح باتصالات HTTP
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoalPulse-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
