name: Build Flutter APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          
      - name: Generate Android Folder & Fix Configurations
        run: |
          cd mobile
          flutter clean
          flutter create . --platforms=android
          flutter pub get
          
          # 1. إصلاح نسخة Kotlin للمشروع الأساسي
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.22"/g' android/settings.gradle
          sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.22'/g" android/build.gradle
          
          # 2. إجبار التطبيق الأساسي على استخدام Android SDK 34
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle
          
          # 3. الضربة القاضية: تغيير المتغيرات في كل المكتبات إلى نصوص "34"
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion "34"/g' {} +
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk "34"/g' {} +
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion "34"/g' {} +
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/targetSdk flutter.targetSdkVersion/targetSdk "34"/g' {} +

          # 4. السماح باتصالات HTTP
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoalPulse-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
