name: Build Flutter APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          
      - name: Generate Android Folder & Fix Configurations
        run: |
          cd mobile
          
          # 1. مسح المجلد وإنشاء واحد نظيف
          rm -rf android
          flutter create . --platforms=android
          flutter pub get
          
          # 2. تحديث نسخة Gradle إلى 8.7
          sed -i 's/distributionUrl=.*/distributionUrl=https\\:\/\/services.gradle.org\/distributions\/gradle-8.7-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
          
          # 3. تعديل settings.gradle (تحديث Kotlin و AGP)
          sed -i 's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.3.0"/g' android/settings.gradle
          sed -i 's/id "com.android.library" version "[^"]*"/id "com.android.library" version "8.3.0"/g' android/settings.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.1.0"/g' android/settings.gradle
          
          # 4. تعديل build.gradle
          sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '2.1.0'/g" android/build.gradle
          
          # 5. إجبار التطبيق الأساسي على SDK 34 (إزالة أي شيء في نهاية السطر)
          sed -i 's/compileSdk .*/compileSdk = 34/g' android/app/build.gradle
          sed -i 's/targetSdk .*/targetSdk = 34/g' android/app/build.gradle
          
          # 6. إصلاح خطأ compileSdkVersion في المكتبات
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/flutter.compileSdkVersion/34/g' {} +
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/flutter.targetSdkVersion/34/g' {} +

          # 7. السماح باتصالات HTTP
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoalPulse-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
