name: Build Flutter APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          
      - name: Generate Android Folder & Fix Configurations
        run: |
          cd mobile
          
          # 1. مسح المجلد وإنشاء واحد نظيف
          rm -rf android
          flutter create . --platforms=android
          flutter pub get
          
          # 2. تحديث نسخة Gradle إلى 8.7
          sed -i 's/distributionUrl=.*/distributionUrl=https\\:\/\/services.gradle.org\/distributions\/gradle-8.7-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
          
          # 3. تعديل settings.gradle (تحديث Kotlin و AGP)
          sed -i 's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.3.0"/g' android/settings.gradle
          sed -i 's/id "com.android.library" version "[^"]*"/id "com.android.library" version "8.3.0"/g' android/settings.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.1.0"/g' android/settings.gradle
          
          # 4. تعديل build.gradle
          sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '2.1.0'/g" android/build.gradle
          
          # 5. إجبار التطبيق الأساسي على SDK 34
          sed -i 's/compileSdk .*/compileSdk = 34/g' android/app/build.gradle
          sed -i 's/targetSdk .*/targetSdk = 34/g' android/app/build.gradle
          
          # 6. إصلاح خطأ compileSdkVersion في المكتبات
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/flutter.compileSdkVersion/34/g' {} +
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/flutter.targetSdkVersion/34/g' {} +

          # 7. استخدام سكربت بايثون لتطبيق تعديلات NDK و Desugaring بشكل آمن
          cat << 'EOF' > fix_ndk.py
          import re

          file_path = 'android/app/build.gradle'
          with open(file_path, 'r') as f:
              content = f.read()

          # إضافة NDK version
          if 'ndkVersion' in content:
              content = re.sub(r'ndkVersion\s*=?\s*[a-zA-Z0-9\.]+', 'ndkVersion = "25.1.8937393"', content)
              content = re.sub(r'ndkVersion\s+[a-zA-Z0-9\.]+', 'ndkVersion = "25.1.8937393"', content)
          else:
              content = content.replace('android {', 'android {\n    ndkVersion = "25.1.8937393"')

          # إضافة Core Library Desugaring
          if 'compileOptions {' in content:
              content = re.sub(r'compileOptions\s*{', 'compileOptions {\n        coreLibraryDesugaringEnabled true', content)
          else:
              content = content.replace('android {', 'android {\n    compileOptions {\n        coreLibraryDesugaringEnabled true\n        sourceCompatibility JavaVersion.VERSION_1_8\n        targetCompatibility JavaVersion.VERSION_1_8\n    }')

          # إضافة المكتبة في dependencies
          desugar_dep = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'"
          if 'dependencies {' in content:
              content = re.sub(r'dependencies\s*{', f'dependencies {{\n    {desugar_dep}', content)
          else:
              content += f'\ndependencies {{\n    {desugar_dep}\n}}\n'

          with open(file_path, 'w') as f:
              f.write(content)
          EOF

          # 8. تشغيل السكربت
          python3 fix_ndk.py

          # 9. السماح باتصالات HTTP
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoalPulse-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
