name: Build Flutter APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          
      - name: Generate Android Folder & Fix Configurations
        run: |
          cd mobile
          flutter create . --platforms=android
          
          # تحديث إعدادات Gradle
          sed -i 's/com.android.tools.build:gradle:.*/com.android.tools.build:gradle:8.1.0/g' android/build.gradle
          sed -i 's/distributionUrl=.*/distributionUrl=https\:\/\/services.gradle.org\/distributions\/gradle-8.4-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          
          # إجبار التطبيق على استخدام Android SDK 34 (دعم الصيغتين القديمة والجديدة)
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' android/app/build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle
          
          # إصلاح المكتبات التي تحتاج تحديث (package_info_plus)
          grep -rl "flutter.compileSdkVersion" ~/.pub-cache/hosted/pub.dev/ | xargs sed -i 's/flutter.compileSdkVersion/34/g' || true
          grep -rl "flutter.targetSdkVersion" ~/.pub-cache/hosted/pub.dev/ | xargs sed -i 's/flutter.targetSdkVersion/34/g' || true

          # السماح باتصالات HTTP
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd mobile
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoalPulse-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
